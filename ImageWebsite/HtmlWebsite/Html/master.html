<!DOCTYPE html>
<html lang="en">
{% load string_utils %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZRLQBS0TW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-BZRLQBS0TW');
  </script>
  <base href="/">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block description %}Cognilume is an AI, Machine Learning, and Web Development platform, showcasing intelligent projects and innovative applications.{% endblock %}">
  <meta name="keywords" content="{% block keywords %}Cognilume, Artificial Intelligence, AI, Machine Learning, Deep Learning, Django, Python, Web Development, Portfolio, AI Projects{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <!-- Open Graph -->
  <meta property="og:title" content="{% block og_title %}Cognilume | Illuminating Vision Through Intelligence{% endblock %}">
  <meta property="og:site_name" content="Cognilume">
  <meta property="og:description" content="{% block og_description %}Explore AI, Machine Learning, and Web Development Platforms.{% endblock %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://www.pragyasavarna.com/Image/logo.jpeg{% endblock %}">
  <meta property="og:image:width" content="{% block og_image_width %}300{% endblock %}">
  <meta property="og:image:height" content="{% block og_image_height %}300{% endblock %}">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.pragyasavarna.com/#organization",
      "name": "Cognilume",
      "url": "https://www.pragyasavarna.com/",
      "logo": "https://www.pragyasavarna.com/Image/logo.jpeg",
      "description": "Cognilume is an AI, Machine Learning, and Web Development platform",
      "email": "contact@pragyasavarna.com",
      "telephone": "+91-9891040687",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91-9891040687",
          "email": "contact@pragyasavarna.com",
          "contactType": "Customer Support",
          "availableLanguage": [
            "English",
            "Hindi"
          ]
        }
      ]
    }
  </script>
  <!-- Default / Global CSS -->
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/header.css">
  <link rel="stylesheet" href="../CSS/footer.css">
  <link rel="stylesheet" href="../CSS/mobile_menu.css">
  <!-- Dynamic CSS Block -->
  {% block extra_css %}
  <!-- Child templates will insert their CSS here -->
  {% endblock %}
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/Image/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/Image/logo.svg">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header>
    {% include 'header.html' %}
  </header>

  <!-- ===== CONTENT SECTION ===== -->
  <main>
    {% block content %}
    <!-- Child pages will load here -->
    {% endblock %}
  </main>

  <!-- Common Footer -->
  <footer>
    {% include 'footer.html' %}
  </footer>
  <script src="../JavaScript/script.js"></script>
  <script src="../JavaScript/footer.js"></script>
  {% block extra_js %}
  <!-- Child templates will insert their CSS here -->
  {% endblock %}
</body>

</html>
