<!DOCTYPE html>
<html lang="en">
{% load string_utils %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZRLQBS0TW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    gtag('config', 'G-BZRLQBS0TW');

  <base href="/">
  <title>{% block title %}{% endblock %}</title>
  <meta name="author" content="Pragya Savarna, Ankit Gupta">
  <meta name="description" content="{% block description %}Cognilume is an AI, Machine Learning, and Web Development platform created by Pragya Savarna and Ankit Gupta, showcasing intelligent projects and innovative applications.{% endblock %}">

  <meta property="og:url" content="https://www.pragyasavarna.com/">

  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">

      "description": "Cognilume is an AI, Machine Learning, and Web Development platform founded by Pragya Savarna and Ankit Gupta.",
      "email": "contact@pragyasavarna.com",
      "telephone": "+91-9891040687",
      "founder": [
        {
          "@type": "Person",
          "name": "Pragya Savarna",
          "url": "https://www.linkedin.com/in/pragya-savarna-030457226/"
        },
        {
          "@type": "Person",
          "name": "Ankit Gupta",
          "url": "https://www.linkedin.com/in/ankit-gupta-869a6091/"
        }
      ],
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91-9891040687",
          "email": "contact@pragyasavarna.com",
          "contactType": "Customer Support",
          "availableLanguage": [
            "English",
            "Hindi"
          ]
        }
      ],
      "sameAs": [
        "https://github.com/pragyasavarna/PragyaPythonProject",
        "https://www.linkedin.com/in/pragya-savarna-030457226/",
        "https://www.linkedin.com/in/ankit-gupta-869a6091/"
      ]
    }

  <!-- Default / Global CSS -->
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/header.css">
  <link rel="stylesheet" href="../CSS/footer.css">
  <link rel="stylesheet" href="../CSS/mobile_menu.css">
  <!-- Dynamic CSS Block -->
  {% block extra_css %}
  <!-- Child templates will insert their CSS here -->
  {% endblock %}
  <link rel="canonical" href="https://www.pragyasavarna.com/">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- <link rel="icon" href="/Image/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/Image/logo.svg"> -->
  <link rel="icon" type="image/png" href="/Image/logo.png">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header>
    {% include 'header.html' %}
  </header>

  <!-- ===== CONTENT SECTION ===== -->
  <main>
    {% block content %}
    <!-- Child pages will load here -->
    {% endblock %}
  </main>

  <!-- Common Footer -->
  <footer>
    {% get_string 'footer_text' %}
  </footer>
  <script src="../JavaScript/script.js"></script>
  {% block extra_js %}
  <!-- Child templates will insert their CSS here -->
  {% endblock %}
</body>

</html>
